<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stoke</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    button, input { font: inherit; }
    button, label { -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; }
    button:disabled, input:disabled { cursor: default; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    h1, h2, p, dl, dd { margin: 0; }
    [hidden] { display: none !important; }
    .page { min-height: 100vh; padding: var(--page-padding); }
    .wrap { max-width: var(--page-width); margin: 0 auto; display: flex; flex-direction: column; gap: var(--page-gap); }
    .header, .header-tools, .brand, .card-heading, .tool-title { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
    .header, .card-heading { justify-content: space-between; }
    .brand { min-width: 0; }
    .header-tools { justify-content: flex-end; }
    .mono { font-family: var(--mono); }
    .muted { color: var(--muted); }
    .small { font-size: 13px; line-height: 1.5; }
    .dry-run { font-family: var(--mono); font-size: 12px; font-weight: 600; border-radius: 6px; padding: 4px 8px; }
    .cards { display: flex; flex-wrap: wrap; gap: 20px; }
    .card { flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; }
    .tool-title { gap: 10px; min-width: 0; }
    .tool-title h2, .warning, dd, .last-result, #error { overflow-wrap: anywhere; }
    .chip { flex: none; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 600; }
    .toggle { display: flex; align-items: center; gap: 10px; min-height: 44px; cursor: pointer; }
    .toggle input { flex: none; margin: 0; cursor: pointer; }
    .switch { appearance: none; -webkit-appearance: none; position: relative; transition: background .15s; }
    .switch::after { content: ""; position: absolute; top: 3px; left: 3px; border-radius: 50%; transition: transform .15s; }
    .switch:checked::after { transform: translateX(20px); }
    .toggle input:disabled { cursor: default; }
    .stoke { min-height: 44px; font-weight: 600; }
    .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .stat { display: flex; flex-direction: column; min-width: 0; gap: 2px; }
    .warning, #error { font-size: 14px; line-height: 1.45; }
    #error { border: 1px solid var(--error-border); background: var(--error-bg); color: var(--error-fg); padding: 12px 14px; border-radius: 10px; }
    .track { overflow: hidden; background: var(--track); border-radius: 3px; }
    .fill { height: 100%; background: var(--accent); }

    /* Dial */
    :root {
      --page-padding: 32px 16px 48px; --page-width: 1120px; --page-gap: 24px;
      --mono: 'IBM Plex Mono', ui-monospace, monospace; --muted: #9AA3AD;
      --track: #252A30; --accent: #F5A142; --focus: #F5A142;
      --error-bg: #3A1714; --error-border: #7A2A22; --error-fg: #FFD9D3;
      background: #0E1013; color: #E6E8EB; font-family: 'IBM Plex Sans', system-ui, sans-serif; color-scheme: dark;
    }
    .brand h1 { font-family: var(--mono); font-size: 22px; font-weight: 600; letter-spacing: .04em; }
    .dry-run { background: #F5A142; color: #1A1206; letter-spacing: .06em; }
    .card { gap: 22px; padding: 24px; border: 1px solid #252A30; border-radius: 16px; background: #15181C; }
    .tool-title h2 { font-size: 22px; font-weight: 600; }
    .chip { font-family: var(--mono); font-weight: 500; background: #3A2A12; color: #F5A142; }
    .chip.closed { background: #23272D; color: #AEB5BD; }
    .chip.running { color: #FFC27A; }
    .toggle { font-size: 14px; color: #C3C9D0; }
    .switch { width: 44px; height: 24px; border-radius: 12px; background: #2C323A; }
    .switch::after { width: 18px; height: 18px; background: #C9CED4; }
    .switch:checked { background: #F5A142; }
    .switch:checked::after { background: #1A1206; }
    .dial-body { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 28px; }
    .dial { position: relative; width: 200px; height: 200px; flex: none; }
    .dial-center { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px; text-align: center; }
    .remaining { font-family: var(--mono); font-size: 30px; font-weight: 600; letter-spacing: -.01em; }
    .dial-details { flex: 1 1 180px; min-width: 0; display: flex; flex-direction: column; gap: 18px; padding-top: 8px; }
    .usage { display: flex; flex-direction: column; gap: 6px; }
    .usage-label { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px; font-size: 13px; }
    .track { height: 4px; }
    .weekly-fill { background: #C9CED4; }
    .weekly-reset { color: #8A939D; font-size: 12px; }
    .stats { gap: 16px; border-top: 1px solid #252A30; padding-top: 18px; }
    .card > .stats { margin-top: auto; }
    .stat { position: relative; gap: 4px; }
    dt { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #8A939D; }
    .stat-head { display: flex; align-items: center; gap: 6px; min-height: 16px; }
    .stat-value { font-family: var(--mono); font-size: 16px; }
    .info { display: flex; }
    .info > summary { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px; border-radius: 50%; border: 1px solid #2E343B; color: #6B737C; font-size: 10px; font-weight: 600; line-height: 1; letter-spacing: 0; text-transform: none; font-family: var(--mono); cursor: pointer; list-style: none; }
    .info > summary::after { content: ""; position: absolute; inset: -9px; }
    .info > summary::-webkit-details-marker { display: none; }
    .info > summary:hover, .info > summary:focus, .info[open] > summary { border-color: #F5A142; color: #F5A142; }
    .info > summary:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    .info-pop { top: calc(100% + 8px); left: 0; width: min(300px, calc(100vw - 48px)); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 400; letter-spacing: normal; text-transform: none; color: #E6E8EB; }
    .info-row { display: flex; justify-content: space-between; gap: 12px; }
    .info-row > :first-child { flex: none; }
    .info-row > :last-child { min-width: 0; overflow-wrap: anywhere; text-align: right; }
    .last-result { font-size: 13px; }
    .failed { color: #FF8A7A; }
    .stoke { border: 1px solid #F5A142; border-radius: 10px; background: transparent; color: #F5A142; font-family: var(--mono); font-size: 14px; letter-spacing: .04em; }
    .stoke:hover:not(:disabled) { background: #F5A142; color: #1A1206; }
    .stoke:disabled { color: #C98A42; border-color: #926B42; }
    .warning { display: flex; align-items: flex-start; gap: 10px; background: #3A1714; border: 1px solid #7A2A22; color: #FFD9D3; border-radius: 10px; padding: 12px 14px; }
    .warning svg { flex: none; margin-top: 1px; }
    .actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .actions .stoke { grid-column: 1 / -1; }
    .refresh { min-height: 44px; padding: 4px 10px; white-space: nowrap; border: 1px solid #2C323A; border-radius: 8px; background: transparent; color: #C3C9D0; font-family: var(--mono); font-size: 14px; }
    .refresh:hover:not(:disabled) { border-color: #F5A142; color: #F5A142; }
    .refresh:disabled { color: #6B737C; }
    .resets { position: relative; display: flex; flex-direction: column; gap: 0; }
    .resets-placeholder { visibility: hidden; }
    .resets-head { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; cursor: pointer; list-style: none; border-radius: 6px; }
    .resets-head::-webkit-details-marker { display: none; }
    .resets-head:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    .resets-head:hover .resets-title { color: #C3C9D0; }
    .resets-count { display: flex; align-items: baseline; gap: 10px; }
    .resets-title { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #8A939D; }
    .chevron { display: inline-block; width: 10px; color: #8A939D; font-family: var(--mono); transition: transform .15s; }
    .resets[open] .chevron { transform: rotate(90deg); }
    .soon-text { color: #F5A142; }
    .popover-surface { position: absolute; z-index: 10; border: 1px solid #2C323A; border-radius: 12px; background: #15181C; box-shadow: 0 16px 40px rgba(0,0,0,.55); }
    .reset-pop { top: calc(100% + 10px); right: 0; width: min(420px, calc(100vw - 48px)); padding: 14px; }
    .reset-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .reset-item { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; padding: 10px 12px; border-radius: 10px; background: #1B1F24; font-size: 13px; }
    .reset-item .mono { font-size: 13px; }
    .reset-item.soon { background: #2B2113; box-shadow: inset 3px 0 0 #F5A142; }
    .reset-item.soon .reset-when { color: #F5A142; }
    .reset-note { font-size: 12px; color: #8A939D; margin-top: 10px; }
    .plan-row { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
    .text-button { min-height: 32px; padding: 2px 0; border: 0; background: transparent; color: #F5A142; font-size: 13px; }
    .text-button:hover:not(:disabled) { text-decoration: underline; }
    dialog { width: min(440px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); padding: 24px; border: 1px solid #2C323A; border-radius: 16px; background: #15181C; color: #E6E8EB; }
    dialog::backdrop { background: rgba(0,0,0,.7); }
    .plan-form { display: flex; flex-direction: column; gap: 18px; }
    .plan-form h2 { font-size: 22px; }
    .plan-form fieldset { min-width: 0; margin: 0; padding: 0; border: 0; }
    .plan-form legend { margin-bottom: 8px; color: #9AA3AD; font-size: 13px; }
    .plan-form label { display: flex; align-items: center; gap: 10px; min-height: 36px; font-size: 14px; }
    .plan-form input { accent-color: #F5A142; }
    #plan-time { padding: 8px 12px; border: 1px solid #2C323A; border-radius: 8px; background: #0E1013; color: #E6E8EB; font-family: var(--mono); }
    #plan-message { white-space: pre-line; overflow-wrap: anywhere; }
    #plan-message.failed { color: var(--error-fg); }
    .dialog-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 12px; }
    .dialog-actions button { padding: 8px 16px; }
    .dialog-actions .text-button { margin-right: auto; padding-left: 0; padding-right: 0; }

    @media (max-width: 931px) {
      .reset-pop { position: static; width: auto; margin-top: 12px; padding: 0; border: 0; box-shadow: none; background: transparent; }
      .resets-placeholder { display: none; }
    }
    @media (max-width: 480px) {
      .header-tools { justify-content: flex-start; }
      .card { padding: 20px; }
      .dial-body { justify-content: center; }
    }
    @media (prefers-reduced-motion: reduce) {
      .switch, .switch::after, .chevron { transition: none; }
    }
  </style>
</head>
<body>
  <p id="error" role="alert" hidden></p>
  <div id="app"></div>
  <dialog id="plan-dialog" aria-labelledby="plan-title">
    <form id="plan-form" class="plan-form">
      <h2 id="plan-title">Plan a stoke</h2>
      <fieldset><legend>Tools</legend><div id="plan-tools"></div></fieldset>
      <label for="plan-time">Local time <input id="plan-time" type="time" value="07:00" required></label>
      <fieldset>
        <legend>Repeat</legend>
        <label><input type="radio" name="repeat" value="once"> Once</label>
        <label><input type="radio" name="repeat" value="daily" checked> Every day</label>
      </fieldset>
      <fieldset>
        <legend>After the planned stoke</legend>
        <label><input type="radio" name="auto_after" value="keep" checked> Keep auto-stoke as is</label>
        <label><input type="radio" name="auto_after" value="on"> Turn auto-stoke on</label>
        <label><input type="radio" name="auto_after" value="off"> Turn auto-stoke off</label>
      </fieldset>
      <p id="plan-hint" class="small muted"></p>
      <p id="plan-message" class="small" role="status" hidden></p>
      <div class="dialog-actions">
        <button id="plan-remove" type="button" class="text-button" hidden>Remove plan</button>
        <button id="plan-close" type="button" class="refresh">Close</button>
        <button id="plan-save" type="submit" class="stoke">Save</button>
      </div>
    </form>
  </dialog>
  <script>
    'use strict';

    // Shared core
    const app = document.querySelector('#app');
    const error = document.querySelector('#error');
    const planDialog = document.querySelector('#plan-dialog');
    const planForm = document.querySelector('#plan-form');
    const planTools = document.querySelector('#plan-tools');
    const planTime = document.querySelector('#plan-time');
    const planSave = document.querySelector('#plan-save');
    const planRemove = document.querySelector('#plan-remove');
    const planMessage = document.querySelector('#plan-message');
    const busy = new Set();
    const inFlightActions = new Map();
    const expanded = new Set();
    const resetsObserver = new ResizeObserver(syncResetPlaceholders);
    const RESET_SOON_SECONDS = 3 * 86400;
    const HOURS = 5 * 3600;
    const CIRCUMFERENCE = 2 * Math.PI * 86;
    const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const WARN = new Map([
      ['auto_stopped', ['Auto-stoke stopped', 'The CLI kept reporting a reset time in the past, so auto-stoke was switched off to avoid repeated messages. Turn auto-stoke on or press Stoke now to resume.']],
      ['did_not_open_window', ['No new window opened', 'The stoke succeeded but the window did not restart.']],
      ['limits_unreadable', ['Limits unreadable', 'The CLI answered but its limits could not be read.']],
      ['stoke_failing', ['Stoke keeps failing', 'Several attempts in a row failed; retrying with backoff.']]
    ]);
    let state = null;
    let clockOffset = 0;
    let refreshId = 0;
    let deferredFocus = null;
    let planFocusKey = null;
    let planTool = null;
    let planSaving = false;
    let displayTimezone = null;
    let zoneFormatter = null;
    const now = () => Date.now() / 1000 + clockOffset;
    const pad = value => String(value).padStart(2, '0');
    const clamp = value => Math.min(1, Math.max(0, value));
    function localDate(value) {
      const zone = state?.timezone ?? 'Europe/Istanbul';
      if (zone !== displayTimezone) {
        displayTimezone = zone;
        zoneFormatter = new Intl.DateTimeFormat('en-US', { timeZone: zone, year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric', hourCycle: 'h23' });
      }
      return Object.fromEntries(zoneFormatter.formatToParts(new Date(value * 1000))
        .filter(part => part.type !== 'literal').map(part => [part.type, Number(part.value)]));
    }
    const calendarDay = date => Date.UTC(date.year, date.month - 1, date.day);
    function clock(value) {
      if (value == null) return '—';
      const date = localDate(value);
      return `${pad(date.hour)}:${pad(date.minute)}`;
    }
    function dateText(value) {
      const date = localDate(value);
      return `${DAYS[new Date(calendarDay(date)).getUTCDay()]} ${date.day} ${MONTHS[date.month - 1]}`;
    }
    function readTime(value, current = now()) {
      const date = localDate(value), today = localDate(current);
      const days = Math.round((calendarDay(today) - calendarDay(date)) / 86400000);
      if (days === 0) return clock(value);
      if (days === 1) return `yesterday ${clock(value)}`;
      return `${dateText(value)}, ${clock(value)}`;
    }
    function when(value, current = now()) {
      if (value == null) return '—';
      const date = localDate(value), today = localDate(current);
      // Calendar dates, rather than elapsed hours, stay correct across DST changes.
      const days = Math.round((calendarDay(date) - calendarDay(today)) / 86400000);
      if (days === 0) return `today ${clock(value)}`;
      if (days === 1) return `tomorrow ${clock(value)}`;
      return `${dateText(value)}, ${clock(value)}`;
    }
    function span(seconds) {
      seconds = Math.max(0, Math.round(seconds));
      const days = Math.floor(seconds / 86400), hours = Math.floor(seconds % 86400 / 3600);
      const minutes = Math.floor(seconds % 3600 / 60);
      if (days) return `${days}d ${hours}h`;
      if (hours) return `${hours}h ${pad(minutes)}m`;
      return `${minutes}m ${pad(seconds % 60)}s`;
    }
    function view(tool, current = now()) {
      const five = tool.five_hour, weekly = tool.weekly, last = tool.last_stoke;
      const open = !!tool.window_open;
      const start = five ? five.resets_at - HOURS : null;
      const end = five ? five.resets_at : null;
      const elapsed = open && five ? clamp((current - start) / HOURS) : 0;
      const nextTs = tool.upcoming_at ?? null;
      const remaining = open && five ? span(end - current) : '—';
      let lastResult = '—';
      if (last) {
        if (!last.ok) lastResult = `Failed: ${last.error ?? '—'}`;
        else if (last.opened_new_window === true) lastResult = 'Opened a new window';
        else if (last.opened_new_window === false) lastResult = 'Did not open a new window';
        else lastResult = 'Succeeded';
      }
      const warning = tool.warning ? WARN.get(tool.warning) : null;
      const lastDuration = last?.duration_ms != null ? `${(last.duration_ms / 1000).toFixed(1)} s` : '—';
      const lastAgo = last ? `${span(current - last.at)} ago` : '';
      const nextAt = nextTs != null ? clock(nextTs) : 'off';
      const nextMeta = nextTs != null ? `${tool.upcoming_planned ? 'planned · ' : ''}in ${span(nextTs - current)}` : 'auto-stoke is off';
      let limitsAt = '';
      if (tool.limits_at != null) {
        limitsAt = `usage as of ${readTime(tool.limits_at, current)}`;
      }
      return {
        name: tool.name, label: tool.label, auto: !!tool.auto_stoke, running: !!tool.running,
        refreshable: !!tool.refreshable, refreshing: !!tool.refreshing, resets: tool.resets,
        plan: tool.plan, plan_outcome: tool.plan_outcome, quiet_from: tool.quiet_from,
        open, elapsed, remaining,
        windowRange: five ? `${clock(start)} → ${clock(end)}` : '—',
        limitsAt,
        fiveUsedNum: five?.used_percent ?? 0, fiveUsed: five ? `${Math.round(five.used_percent)}%` : '—',
        weeklyNum: weekly?.used_percent ?? 0, weeklyUsed: weekly ? `${Math.round(weekly.used_percent)}%` : '—',
        weeklyReset: weekly ? `resets ${when(weekly.resets_at, current)}` : '—',
        lastTs: last?.at ?? null, lastAt: last ? clock(last.at) : '—',
        lastTrigger: last?.trigger ?? '—', lastDuration, lastAgo,
        lastOk: !!last?.ok, lastResult, nextAt, nextMeta,
        buttonText: tool.running ? 'Stoking…' : 'Stoke now',
        dialStatus: tool.running ? 'Stoking…' : open ? 'Window open' : 'Window closed',
        dialLabel: open && five ? `Window ${Math.round(elapsed * 100)}% elapsed, ${remaining} left` : 'Window closed',
        dialCaption: open && five ? `left · ends ${clock(end)}` : 'window closed',
        hasWarning: !!tool.warning, warning: warning ? warning[0] : tool.warning,
        warningDetail: tool.warning ? `${warning ? warning[1] + ' ' : ''}Failures: ${tool.consecutive_failures ?? 0}.` : ''
      };
    }
    function el(tag, className = '', text) {
      const element = document.createElement(tag);
      if (className) element.setAttribute('class', className);
      if (text != null) element.textContent = text;
      return element;
    }
    function svg(tag, attrs) {
      const element = document.createElementNS('http://www.w3.org/2000/svg', tag);
      Object.entries(attrs).forEach(([key, value]) => element.setAttribute(key, value));
      return element;
    }
    function icon(kind) {
      const flame = kind === 'flame';
      const image = svg('svg', { width: flame ? 28 : 18, height: flame ? 28 : 18, viewBox: '0 0 24 24', fill: 'none', stroke: flame ? '#F5A142' : '#FF8A7A', 'stroke-width': flame ? 1.8 : 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'aria-hidden': 'true' });
      const paths = flame ? ['M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2.2 1.2-3.6 2.4-4.6.3 1.6 1.1 2.6 2.1 3.1C11 8.8 11 5.8 12 3z'] : ['M12 3 2 20h20L12 3z', 'M12 10v4', 'M12 17h.01'];
      paths.forEach(d => image.append(svg('path', { d })));
      return image;
    }
    function live(element, field, tool) {
      element.setAttribute('data-live', field);
      if (tool) element.setAttribute('data-tool', tool.name);
      return element;
    }
    function text(tag, className, tool, field) { return live(el(tag, className, tool[field]), field, tool); }
    function badge(currentState) {
      const element = el('span', 'dry-run', 'DRY RUN · no CLI calls');
      element.setAttribute('id', 'dry-run');
      element.hidden = !currentState?.dry_run;
      return element;
    }
    function page(header) {
      const outer = el('div', 'page'), wrap = el('div', 'wrap');
      wrap.append(header, error);
      outer.append(wrap);
      return { outer, wrap };
    }
    function standardHeader(currentState) {
      const header = el('header', 'header'), brand = el('div', 'brand');
      brand.append(icon('flame'), el('h1', '', 'stoke'), badge(currentState));
      const controls = el('div', 'header-tools');
      controls.append(live(el('p', 'mono muted small'), 'dialClock'));
      header.append(brand, controls);
      return header;
    }
    function warning(tool) {
      const box = el('div', 'warning'), copy = el('div');
      box.append(icon('warning'));
      copy.append(el('strong', '', tool.warning), el('br'), el('span', '', tool.warningDetail));
      box.append(copy);
      return box;
    }
    function autoControl(tool) {
      const label = el('label', 'toggle'), input = el('input', 'switch');
      input.setAttribute('type', 'checkbox');
      input.setAttribute('data-key', `${tool.name}:auto`);
      input.setAttribute('data-tool', tool.name);
      input.setAttribute('aria-label', `Auto-stoke for ${tool.label}`);
      input.checked = tool.auto;
      input.disabled = busy.has(tool.name);
      input.addEventListener('change', () => act(tool.name, 'auto', { enabled: input.checked }));
      label.append(el('span', '', 'Auto-stoke'), input);
      return label;
    }
    function stokeControl(tool) {
      const button = el('button', 'stoke', tool.buttonText);
      button.setAttribute('type', 'button');
      button.setAttribute('data-key', `${tool.name}:stoke`);
      button.setAttribute('data-tool', tool.name);
      button.setAttribute('data-action', 'stoke');
      button.setAttribute('aria-label', `Stoke ${tool.label} now`);
      button.disabled = tool.running || busy.has(tool.name);
      button.addEventListener('click', () => act(tool.name, 'stoke'));
      return button;
    }
    function refreshControl(tool) {
      const button = el('button', 'refresh', refreshText(tool));
      button.setAttribute('type', 'button');
      button.setAttribute('data-key', `${tool.name}:refresh`);
      button.setAttribute('data-tool', tool.name);
      button.setAttribute('data-action', 'refresh');
      button.setAttribute('aria-label', `Read ${tool.label} usage now without stoking`);
      button.setAttribute('title', tool.refreshable ? 'Read usage and limit resets now. Sends no message and opens no window.' : `${tool.label} usage can only be read by stoking.`);
      button.disabled = !tool.refreshable || tool.refreshing || tool.running || busy.has(tool.name);
      button.addEventListener('click', () => act(tool.name, 'refresh'));
      return button;
    }
    function refreshText(tool) {
      return tool.refreshable && (tool.refreshing || inFlightActions.get(tool.name) === 'refresh') ? 'Reading…' : '↻ Refresh usage';
    }
    function popover(tool, kind, className) {
      const box = el('details', `${className} popover`), key = `${tool.name}:${kind}`;
      box.setAttribute('data-popover', key);
      box.open = expanded.has(key);
      box.addEventListener('toggle', () => {
        if (box.isConnected) box.open ? expanded.add(key) : expanded.delete(key);
      });
      return box;
    }
    function resetCredits(tool, current = now()) {
      const resets = tool.resets;
      const box = popover(tool, 'resets', 'resets'), head = el('summary', 'resets-head'), count = el('div', 'resets-count');
      head.setAttribute('data-key', `${tool.name}:resets`);
      const sorted = [...resets.credits].sort((a, b) => a.expires_at - b.expires_at);
      const first = sorted[0], soonFirst = first && first.expires_at - current < RESET_SOON_SECONDS;
      count.append(el('span', 'chevron', '›'), el('span', 'resets-title', 'Limit resets'),
        el('span', 'stat-value', resets.available ? `${resets.available} available` : 'none available'));
      head.append(count);
      if (first) head.append(el('span', `small ${soonFirst ? 'soon-text' : 'muted'}`,
        `next expires ${when(first.expires_at, current)} · in ${span(first.expires_at - current)}`));
      box.append(head);
      const pop = el('div', 'popover-surface reset-pop'), list = el('ul', 'reset-list');
      sorted.forEach(credit => {
        const left = credit.expires_at - current, soon = left < RESET_SOON_SECONDS;
        const item = el('li', `reset-item${soon ? ' soon' : ''}`);
        item.append(el('span', '', credit.title), el('span', 'mono reset-when',
          `expires ${when(credit.expires_at, current)} · in ${span(left)}`));
        list.append(item);
      });
      if (sorted.length) pop.append(list);
      pop.append(el('p', 'reset-note', `As of ${readTime(resets.read_at, current)}. Use them from the Codex app or CLI. Stoke only shows them; it never spends one.`));
      box.append(pop);
      return box;
    }
    function resetPlaceholder() {
      const box = el('div', 'resets-placeholder');
      box.setAttribute('aria-hidden', 'true');
      box.setAttribute('inert', '');
      return box;
    }
    function syncResetPlaceholders() {
      // Match actual summary wrapping and font metrics without synthetic credits.
      const summaries = Array.from(app.querySelectorAll('.resets-head'));
      const height = Math.max(0, ...summaries.map(summary => summary.getBoundingClientRect().height));
      app.querySelectorAll('.resets-placeholder').forEach(box => {
        box.hidden = height === 0;
        box.style.height = `${height}px`;
      });
    }
    window.addEventListener('resize', syncResetPlaceholders);
    function planButton(tool) {
      const button = el('button', 'refresh', tool.plan ? '✎ Edit plan' : '+ Plan a stoke');
      button.setAttribute('type', 'button');
      button.setAttribute('data-key', `${tool.name}:plan-open`);
      button.setAttribute('data-tool', tool.name);
      button.disabled = busy.has(tool.name);
      button.addEventListener('click', () => openPlan(tool.name, button.dataset.key));
      return button;
    }
    function planRow(tool, current = now()) {
      const row = el('div', 'plan-row'), plan = tool.plan;
      if (plan) {
        let description = `Plan · ${plan.repeat === 'daily' ? `every day ${plan.time}` : `once, ${when(plan.target_at, current)}`}`;
        if (plan.auto_after != null) description += ` · then auto-stoke ${plan.auto_after ? 'on' : 'off'}`;
        row.append(el('p', '', description), el('p', 'small muted', `No auto-stoke ${clock(tool.quiet_from)}–${clock(plan.target_at)}`));
      }
      const outcome = tool.plan_outcome;
      if (outcome && ['missed', 'broken'].includes(outcome.result) && current - outcome.at >= 0 && current - outcome.at < 86400) {
        row.append(el('p', 'small muted', `Last plan ${clock(outcome.target_at)}: ${outcome.result === 'broken' ? 'skipped by manual stoke' : 'missed'}`));
      }
      return row;
    }
    function updatePlanSave() {
      planSave.disabled = planSaving || !planTools.querySelector('input:checked');
    }
    function syncPlanRemove() {
      const tool = state?.tools[planTool];
      planRemove.hidden = !tool?.plan || planSave.hidden;
      planRemove.disabled = planSaving || busy.has(planTool);
      planRemove.textContent = `Remove ${tool?.label ?? ''} plan`;
    }
    function setPlanSaving(saving) {
      planSaving = saving;
      planForm.querySelectorAll('input').forEach(input => { input.disabled = saving || planSave.hidden; });
      document.querySelector('#plan-close').disabled = saving;
      updatePlanSave();
      syncPlanRemove();
    }
    function showPlanMessage(message, failed) {
      planMessage.textContent = message;
      planMessage.setAttribute('class', `small${failed ? ' failed' : ''}`);
      planMessage.hidden = false;
    }
    function updatePlanHint() {
      const value = planTime.value;
      const [hours, minutes] = value.split(':').map(Number);
      const from = (hours * 60 + minutes - 300 + 1440) % 1440;
      document.querySelector('#plan-hint').textContent = value ? `No auto-stoke from ${pad(Math.floor(from / 60))}:${pad(from % 60)} until ${value}. (${state?.timezone ?? 'Europe/Istanbul'})` : '';
    }
    function openPlan(name, focusKey) {
      if (planSaving || busy.has(name)) return;
      const plan = state.tools[name].plan;
      planTool = name;
      planFocusKey = focusKey;
      planSaving = false;
      planSave.hidden = false;
      planSave.textContent = 'Save';
      planMessage.hidden = true;
      planMessage.textContent = '';
      planTime.value = plan?.time ?? '07:00';
      planForm.querySelectorAll('[name="repeat"]').forEach(input => { input.checked = input.value === (plan?.repeat ?? 'daily'); });
      const after = plan?.auto_after == null ? 'keep' : plan.auto_after ? 'on' : 'off';
      planForm.querySelectorAll('[name="auto_after"]').forEach(input => { input.checked = input.value === after; });
      planTools.replaceChildren();
      Object.values(state.tools).forEach(tool => {
        const label = el('label'), input = el('input');
        input.setAttribute('type', 'checkbox');
        input.setAttribute('value', tool.name);
        input.checked = tool.name === name;
        input.addEventListener('change', updatePlanSave);
        label.append(input, el('span', '', tool.label));
        planTools.append(label);
      });
      planForm.querySelectorAll('input').forEach(input => { input.disabled = false; });
      updatePlanSave();
      syncPlanRemove();
      updatePlanHint();
      planDialog.showModal();
    }
    planTime.addEventListener('input', updatePlanHint);
    document.querySelector('#plan-close').addEventListener('click', () => planDialog.close());
    planDialog.addEventListener('close', () => restoreFocus(planFocusKey));
    planRemove.addEventListener('click', async () => {
      if (planSaving || planRemove.disabled || !state?.tools[planTool]?.plan) return;
      const name = planTool;
      setPlanSaving(true);
      try {
        await post(name, 'plan/cancel');
        await refresh();
        planDialog.close();
      } catch (failure) {
        showPlanMessage(failure.message, true);
      } finally {
        setPlanSaving(false);
        if (planDialog.open) (planRemove.hidden ? document.querySelector('#plan-close') : planRemove).focus();
      }
    });
    planForm.addEventListener('submit', async event => {
      event.preventDefault();
      if (planSaving || planSave.disabled) return;
      const names = Array.from(planTools.querySelectorAll('input:checked')).map(input => input.value);
      const time = planTime.value, repeat = planForm.querySelector('[name="repeat"]:checked').value;
      const after = planForm.querySelector('[name="auto_after"]:checked').value;
      const body = { time, repeat, auto_after: after === 'keep' ? null : after === 'on' };
      const messages = [], failures = [];
      setPlanSaving(true);
      planSave.textContent = 'Saving…';
      for (const name of names) {
        try {
          const result = await post(name, 'plan', body);
          if (result.plan_shifted) messages.push(`${result.label}: its window is still open at ${time}, so the first planned stoke is ${when(result.plan.target_at)}.`);
        } catch (failure) { failures.push(`${state.tools[name].label}: ${failure.message}`); }
      }
      await refresh();
      setPlanSaving(false);
      planSave.textContent = 'Save';
      if (messages.length || failures.length) {
        showPlanMessage([...failures, ...messages].join('\n'), failures.length > 0);
        planSave.hidden = messages.length > 0;
        planForm.querySelectorAll('input').forEach(input => { input.disabled = messages.length > 0; });
        updatePlanSave();
        syncPlanRemove();
        (messages.length ? document.querySelector('#plan-close') : planSave).focus();
      } else planDialog.close();
    });
    function toolTitle(tool) {
      const title = el('div', 'tool-title');
      title.append(el('h2', '', tool.label), text('span', `chip ${tool.running ? 'running' : tool.open ? '' : 'closed'}`, tool, 'dialStatus'));
      return title;
    }
    function lastInfo(tool) {
      const box = popover(tool, 'last', 'info'), head = el('summary', '', 'i');
      head.setAttribute('data-key', `${tool.name}:last-info`);
      head.setAttribute('aria-label', `Details of the last ${tool.label} stoke`);
      const pop = el('div', 'popover-surface info-pop');
      if (tool.lastTs == null) pop.append(el('span', 'muted', 'No stoke yet.'));
      else {
        [['Triggered', 'lastTrigger'], ['Took', 'lastDuration'], ['When', 'lastAgo'], ['Result', 'lastResult']].forEach(([label, field]) => {
          const row = el('div', 'info-row');
          row.append(el('span', 'muted', label), text('span', field === 'lastResult' && !tool.lastOk ? 'failed' : '', tool, field));
          pop.append(row);
        });
      }
      box.append(head, pop);
      return box;
    }
    function stat(list, title, tool, field) {
      const item = el('div', 'stat');
      const head = el('dt', 'stat-head', title);
      if (field === 'lastAt') head.append(lastInfo(tool));
      item.append(head, text('dd', 'stat-value', tool, field));
      list.append(item);
      return item;
    }
    function syncControls() {
      const tools = new Map(Object.values(state?.tools ?? {}).map(tool => [tool.name, tool]));
      app.querySelectorAll('button[data-tool], input[data-tool]').forEach(control => {
        const tool = tools.get(control.dataset.tool);
        if (!tool) return;
        control.disabled = busy.has(tool.name) || (control.dataset.action === 'refresh' ? !tool.refreshable || tool.refreshing || tool.running : control.dataset.action === 'stoke' && tool.running);
        if (control.dataset.action === 'refresh') control.textContent = refreshText(tool);
        if (control.tagName === 'INPUT' && !busy.has(tool.name)) control.checked = tool.auto_stoke;
      });
      if (planDialog.open) syncPlanRemove();
      if (!planDialog.open) restoreFocus(deferredFocus);
    }
    function restoreFocus(key) {
      if (!key) return;
      const control = Array.from(app.querySelectorAll('[data-key]')).find(element => element.dataset.key === key);
      if (control && !control.disabled) {
        control.focus({ preventScroll: true });
        deferredFocus = null;
      } else if (control) deferredFocus = key;
    }
    // A later focus choice supersedes a control temporarily disabled by an action.
    document.addEventListener('focusin', event => {
      if (event.target.dataset?.key !== deferredFocus) deferredFocus = null;
    });
    function closePopover(box) {
      box.open = false;
      expanded.delete(box.dataset.popover);
    }
    document.addEventListener('click', event => {
      app.querySelectorAll('details.popover[open]').forEach(box => {
        if (!box.contains(event.target)) closePopover(box);
      });
    }, true);
    document.addEventListener('keydown', event => {
      if (event.key !== 'Escape' || planDialog.open) return;
      const boxes = Array.from(app.querySelectorAll('details.popover[open]'));
      const focused = boxes.find(box => box.contains(document.activeElement)) ?? boxes.at(-1);
      boxes.forEach(closePopover);
      if (focused) {
        event.preventDefault();
        focused.querySelector('summary').focus({ preventScroll: true });
      }
    });
    function showError(message) {
      error.textContent = message;
      error.hidden = !message;
    }
    async function post(name, action, body) {
      const response = await fetch(`/api/tools/${encodeURIComponent(name)}/${action}`, {
        method: 'POST', headers: { 'X-Stoke': '1', 'Content-Type': 'application/json' },
        body: body === undefined ? undefined : JSON.stringify(body)
      });
      if (!response.ok) {
        let result;
        try { result = await response.json(); } catch (_) { /* Use the HTTP fallback. */ }
        const failure = new Error(result?.detail || `HTTP ${response.status}`);
        failure.code = result?.code;
        failure.status = response.status;
        failure.plan_target_at = result?.plan_target_at;
        throw failure;
      }
      return response.json();
    }
    async function act(name, action, body) {
      if (busy.has(name) || (action === 'refresh' && !state?.tools[name]?.refreshable)) return;
      deferredFocus = document.activeElement?.dataset?.key ?? null;
      busy.add(name);
      inFlightActions.set(name, action);
      syncControls();
      try {
        try { await post(name, action, body); }
        catch (failure) {
          if (action !== 'stoke' || failure.status !== 409 || failure.code !== 'plan_conflict') throw failure;
          await refresh();
          const tool = state.tools[name], plan = tool.plan;
          let message = `Stoke ${tool.label} now? Its window would still be open at ${clock(failure.plan_target_at)}, so today's plan is skipped.`;
          message += plan?.repeat === 'daily' ? ' The daily plan continues tomorrow.' : ' The one-time plan is cancelled.';
          if (plan?.repeat === 'once' && plan.auto_after === true && !tool.auto_stoke) message += ' Auto-stoke stays off.';
          if (window.confirm(message)) await post(name, action, { break_plan: true });
        }
        showError('');
      } catch (failure) {
        showError(failure.message);
      } finally {
        await refresh();
        busy.delete(name);
        inFlightActions.delete(name);
        syncControls();
      }
    }
    async function refresh() {
      const request = ++refreshId;
      try {
        const response = await fetch('/api/state', { cache: 'no-store' });
        if (!response.ok) {
          let detail;
          try { detail = (await response.json()).detail; } catch (_) { /* Use the HTTP fallback. */ }
          throw new Error(detail || `HTTP ${response.status}`);
        }
        const result = await response.json();
        if (request !== refreshId) return;
        clockOffset = result.server_time - Date.now() / 1000;
        state = result;
        render();
        if (error.textContent.startsWith('State unavailable')) showError('');
      } catch (failure) {
        if (request === refreshId) showError(`State unavailable: ${failure.message}`);
      }
    }
    function render() {
      const focusKey = planDialog.open ? null : document.activeElement?.dataset?.key ?? deferredFocus;
      app.querySelectorAll('details.popover').forEach(box => {
        box.open ? expanded.add(box.dataset.popover) : expanded.delete(box.dataset.popover);
      });
      const vm = Object.values(state?.tools ?? {}).map(tool => view(tool));
      app.replaceChildren(renderDial(state, vm));
      resetsObserver.disconnect();
      app.querySelectorAll('.resets-head').forEach(head => resetsObserver.observe(head));
      syncResetPlaceholders();
      if (planDialog.open) syncPlanRemove();
      tick();
      restoreFocus(focusKey);
    }
    function tick() {
      const current = now();
      const vm = Object.values(state?.tools ?? {}).map(tool => view(tool, current));
      const tools = new Map(vm.map(tool => [tool.name, tool]));
      const clockText = `Raspberry Pi · synced ${clock(current)}`;
      app.querySelectorAll('[data-live]').forEach(element => {
        const field = element.dataset.live, tool = tools.get(element.dataset.tool);
        if (field === 'arc') {
          element.setAttribute('stroke-dasharray', `${(tool.elapsed * CIRCUMFERENCE).toFixed(1)} ${CIRCUMFERENCE.toFixed(1)}`);
          element.setAttribute('stroke-opacity', tool.elapsed > 0 ? '1' : '0');
        } else if (field === 'dialLabel') element.setAttribute('aria-label', tool.dialLabel);
        else {
          const value = tool ? tool[field] : clockText;
          if (value != null && element.textContent !== String(value)) element.textContent = value;
        }
      });
    }

    // Dial
    function renderDial(currentState, vm) {
      const { outer, wrap } = page(standardHeader(currentState));
      const main = el('main', 'cards');
      vm.forEach(tool => {
        const card = el('section', 'card');
        if (tool.hasWarning) card.append(warning(tool));
        const heading = el('div', 'card-heading');
        heading.append(toolTitle(tool), autoControl(tool));
        const body = el('div', 'dial-body'), dial = el('div', 'dial');
        const ring = live(svg('svg', { width: 200, height: 200, viewBox: '0 0 200 200', role: 'img', 'aria-label': tool.dialLabel }), 'dialLabel', tool);
        ring.append(svg('circle', { cx: 100, cy: 100, r: 86, fill: 'none', stroke: '#252A30', 'stroke-width': 12 }));
        ring.append(live(svg('circle', { cx: 100, cy: 100, r: 86, fill: 'none', stroke: '#F5A142', 'stroke-width': 12, 'stroke-linecap': 'round', transform: 'rotate(-90 100 100)' }), 'arc', tool));
        const center = el('div', 'dial-center');
        center.append(text('span', 'remaining', tool, 'remaining'), text('span', 'small muted', tool, 'dialCaption'));
        dial.append(ring, center);
        const details = el('div', 'dial-details'), range = el('div', 'usage-label');
        range.append(el('span', 'muted', 'Window'), text('span', 'mono', tool, 'windowRange'));
        details.append(range, dialUsage(tool, false), dialUsage(tool, true));
        details.append(tool.resets != null ? resetCredits(tool) : resetPlaceholder());
        body.append(dial, details);
        const stats = el('dl', 'stats');
        const last = stat(stats, 'Last stoke', tool, 'lastAt');
        if (!tool.lastOk && tool.lastTs != null) last.append(el('dd', 'last-result failed', tool.lastResult));
        stat(stats, 'Next stoke', tool, 'nextAt').append(text('dd', 'small muted', tool, 'nextMeta'));
        card.append(heading, body, planRow(tool), stats);
        const actions = el('div', 'actions');
        actions.append(stokeControl(tool), refreshControl(tool), planButton(tool));
        card.append(actions);
        main.append(card);
      });
      wrap.append(main);
      return outer;
    }
    function dialUsage(tool, weekly) {
      const group = el('div', 'usage'), label = el('div', 'usage-label');
      const usage = el('span', 'mono', weekly ? tool.weeklyUsed : tool.fiveUsed);
      label.append(el('span', 'muted', weekly ? 'Weekly use' : '5-hour use'), usage);
      const track = el('div', 'track'), fill = el('div', weekly ? 'fill weekly-fill' : 'fill');
      fill.style.width = `${clamp((weekly ? tool.weeklyNum : tool.fiveUsedNum) / 100) * 100}%`;
      track.append(fill);
      group.append(label, track);
      if (weekly) group.append(text('span', 'weekly-reset', tool, 'weeklyReset'));
      if (weekly && tool.limitsAt) group.append(text('span', 'weekly-reset', tool, 'limitsAt'));
      return group;
    }

    render();
    refresh();
    setInterval(refresh, 5000);
    setInterval(tick, 1000);
  </script>
</body>
</html>
