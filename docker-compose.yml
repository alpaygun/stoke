services:
  stoke:
    build: .
    env_file:
      - path: .env
        required: false
    ports:
      - "${STOKE_PUBLISH_HOST:-127.0.0.1}:${STOKE_PUBLISH_PORT:-8787}:8787"
    volumes:
      - ./data:/data
      - codex-home:/home/stoke/.codex
    mem_limit: 512m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"

volumes:
  codex-home:
